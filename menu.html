<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MENU NGANG MỘT CẤP</title>
    </head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .menu {
            background-color: rgb(111, 102, 3);
            overflow: hidden;
        }

        .menu ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .menu ul li {
            float: left;
        }

        .menu ul li a {
            display: block;
            color: rgb(251, 240, 250);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            display:block;
        }

        .menu ul li a:hover {
            background-color: #879c01;
        }
    </style>
    <body>
        <h1>MINH HỌA MENU NGANG - MỘT CẤP</h1>
        <div class="menu">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Giới thiệu</a></li>
                <li><a href="#">Dự án</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Dịch vụ</a></li>
                <li><a href="#">Tin tức</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </div>
    </body>
</html>
